<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Be Alert — Know what’s happening around you</title>
    <meta
      name="description"
      content="Be Alert is your neighbourhood’s live radar: urgent alerts, blood requests, outages, traffic, jobs, rentals, deals and trusted local services — everything within 1–50 km of you. Free on Android and the web."
    />
    <link rel="canonical" href="https://bealert.online/" />
    <meta property="og:url" content="https://bealert.online/" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Be Alert" />
    <meta property="og:title" content="Be Alert — Your neighbourhood, live" />
    <meta property="og:description" content="Urgent alerts, blood requests, outages, jobs, deals and trusted services within 1–50 km of you." />
    <meta property="og:image" content="https://bealert.online/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be Alert — Your neighbourhood, live" />
    <meta name="twitter:description" content="Everything happening within 1–50 km of you, in one app." />
    <meta name="twitter:image" content="https://bealert.online/og-image.png" />

    <!-- without JavaScript, scroll-reveal content must still be visible -->
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Be Alert",
        "operatingSystem": "Android, Web",
        "applicationCategory": "SocialNetworkingApplication",
        "description": "Live neighbourhood alerts, blood requests, outages, jobs, rentals, deals and verified local services within 1–50 km.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PKR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
