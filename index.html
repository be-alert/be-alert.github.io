<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Be Alert — Know what’s happening around you</title>
    <meta
      name="description"
      content="Be Alert is your neighbourhood’s live radar: urgent alerts, blood requests, outages, traffic, jobs, rentals, deals and trusted local services — everything within 1–50 km of you. Free on Android and the web."
    />
    <link rel="canonical" href="https://razachaudhary5512-a11y.github.io/" />
    <meta property="og:url" content="https://razachaudhary5512-a11y.github.io/" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Be Alert" />
    <meta property="og:title" content="Be Alert — Your neighbourhood, live" />
    <meta property="og:description" content="Urgent alerts, blood requests, outages, jobs, deals and trusted services within 1–50 km of you." />
    <meta property="og:image" content="https://razachaudhary5512-a11y.github.io/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Be Alert — Your neighbourhood, live" />
    <meta name="twitter:description" content="Everything happening within 1–50 km of you, in one app." />
    <meta name="twitter:image" content="https://razachaudhary5512-a11y.github.io/og-image.png" />

    <!-- fonts and the hero phone screenshot: start downloading before the CSS/JS -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/plus-jakarta-sans-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/instrument-serif-italic-latin.woff2" crossorigin />
    <link rel="preload" as="image" href="./screens/feed-dark.webp" fetchpriority="high" />
    <!-- without JavaScript, scroll-reveal content must still be visible -->
    <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Urdu tagline: only the glyphs used are downloaded -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500&display=swap&text=%D8%A7%D9%BE%D9%86%DB%92%20%D8%A2%D8%B3%20%D9%BE%D8%A7%D8%B3%20%DA%A9%DB%8C%20%DB%81%D8%B1%20%D8%AE%D8%A8%D8%B1" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@500&display=swap&text=%D8%A7%D9%BE%D9%86%DB%92%20%D8%A2%D8%B3%20%D9%BE%D8%A7%D8%B3%20%DA%A9%DB%8C%20%DB%81%D8%B1%20%D8%AE%D8%A8%D8%B1" rel="stylesheet" /></noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Be Alert",
        "operatingSystem": "Android, Web",
        "applicationCategory": "SocialNetworkingApplication",
        "description": "Live neighbourhood alerts, blood requests, outages, jobs, rentals, deals and verified local services within 1–50 km.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PKR" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
